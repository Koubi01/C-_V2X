version: '3.8'

services:
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: v2x_postgres
    environment:
      POSTGRES_USER: v2x_admin
      POSTGRES_PASSWORD: supertajneheslo
      POSTGRES_DB: v2x_database
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: v2x_pgadmin
    environment:
      # Přihlašovací údaje do samotného webového rozhraní pgAdminu
      PGADMIN_DEFAULT_EMAIL: admin@v2x.cz
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80" # pgAdmin poběží na portu 5050
    depends_on:
      - db

  web:
    build: 
      context: . # Context je root složka, aby Docker viděl do složky 'src'
      dockerfile: docker/web/Dockerfile
    container_name: v2x_web
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Database=v2x_database;Username=v2x_admin;Password=supertajneheslo
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      # Namapujeme složku s PCAP soubory přímo do kontejneru, aby je C# + TShark mohly číst
      - ./PcapData:/app/PcapData
    restart: unless-stopped

  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: v2x_tileserver
    ports:
      - "8081:8080"
    volumes:
      - ./tiles:/data
    restart: unless-stopped

volumes:
  pgdata: